<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nada & Chord</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111827">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--ac:#22c55e;--bd:#374151}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:env(safe-area-inset-top) 12px 40px}
h1{font-size:20px;margin:14px 0}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
button,.btn{background:var(--ac);color:#06220f;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px;cursor:pointer;display:inline-block}
button.s{background:#374151;color:var(--tx)}button:disabled{opacity:.4}
input[type=range]{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.big{font-size:28px;font-weight:800}.mu{color:var(--mu);font-size:13px}
#chords{display:flex;flex-wrap:wrap;gap:6px;max-height:240px;overflow:auto}
.ch{background:#111827;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-weight:700;min-width:54px;text-align:center}
.ch small{display:block;color:var(--mu);font-weight:400;font-size:10px}.ch.on{background:var(--ac);color:#06220f}
audio{width:100%;margin-top:8px}.alt button{margin:4px 4px 0 0}
body{padding-bottom:90px}
#tl{width:100%;height:96px;display:block;background:#0b1220;border-radius:10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1220;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:14px 4px;font-size:15px}nav button.on{color:var(--ac)}
.gw{max-width:420px;margin:0 auto}.str{flex:1;text-align:center;background:#111827;border:2px solid var(--bd);border-radius:50%;aspect-ratio:1;display:flex;flex-direction:column;justify-content:center;font-weight:800;font-size:17px;min-width:0}
.str small{font-size:10px;color:var(--mu);font-weight:400}.str.on{border-color:var(--ac);color:var(--ac)}.str.ok{background:var(--ac);color:#06220f}
#needle{transition:transform .12s;transform-origin:150px 150px}
</style></head><body>
<h1>🎸 Nada & Chord</h1>
<div id="pageSong">

<div class="card"><label class="btn">📂 Pilih file lagu<input id="file" type="file" accept="audio/*,video/*" hidden></label>
<span class="mu" id="fn"> belum ada file</span><div class="mu" id="st"></div></div>

<div class="card" id="res" hidden>
<div class="mu">Nada dasar (Do =)</div><div class="big" id="doKey">-</div>
<div class="mu" id="keyInfo"></div><div class="alt" id="alt"></div></div>

<div class="card" id="ctl" hidden>
<div class="row"><b>Pitch:</b> <span id="semv">0</span> nada</div>
<input id="sem" type="range" min="-12" max="12" step="1" value="0">
<div class="row"><b>Tempo:</b> <span id="tv">100</span>%</div>
<input id="tempo" type="range" min="50" max="150" step="5" value="100">
<div class="row"><button id="go">▶ Terapkan</button>
<button class="s" id="rst">Reset</button></div>
<div class="mu" id="pg"></div>
<audio id="au" controls></audio>
<div class="row" style="margin-top:10px"><button class="s" id="exw">⬇ Ekspor WAV</button><button class="s" id="exm">⬇ Ekspor MP3</button></div></div>

<div class="card" id="chc" hidden><div class="row" style="justify-content:space-between"><b>Chord</b><span class="mu" id="bpm"></span></div>
<div class="big" id="now" style="margin:6px 0">-</div><canvas id="tl"></canvas>
<div class="row" style="margin-top:8px"><button class="s" id="b1">⇦ Geser hitungan</button><button class="s" id="bh">½×</button><button class="s" id="bd">2×</button></div>
<div class="mu" style="margin-top:6px">Garis tebal = ketukan 1 (4/4), garis putus = setengah ketukan. Perkiraan, bukan 100% akurat.</div></div>
</div>
<div id="pageTune" hidden><div class="card gw" style="text-align:center">
<svg viewBox="0 0 300 160" width="100%"><path d="M46 90A120 120 0 0 1 254 90" fill="none" stroke="#374151" stroke-width="6"/><g id="ticks"></g>
<g id="needle"><line x1="150" y1="150" x2="150" y2="40" stroke="#f97316" stroke-width="4" stroke-linecap="round"/></g><circle cx="150" cy="150" r="8" fill="#f97316"/></svg>
<div class="big" id="tn" style="font-size:56px">-</div><div id="hz" class="mu">- Hz</div><div id="tc" style="margin:8px 0;font-weight:700">Tekan mulai, lalu petik satu senar</div>
<div class="row" id="strs" style="flex-wrap:nowrap;margin:12px 0"></div>
<button id="tb">🎤 Mulai</button></div></div>
<nav><button id="n1" class="on">🎵 Lagu</button><button id="n2">🎸 Tuner</button></nav>
<script>
const $=s=>document.querySelector(s),NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const wait=()=>new Promise(r=>setTimeout(r,0));
let buf,chords=[],keys=[],sem=0,tempo=1,outCh=null,outSr=0,fileUrl;
const au=$('#au');

function fft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}
for(let l=2;l<=n;l<<=1){const a=-2*Math.PI/l,wr=Math.cos(a),wi=Math.sin(a);for(let i=0;i<n;i+=l){let cr=1,ci=0;for(let k=0;k<l/2;k++){const u=i+k,v=u+l/2,xr=re[v]*cr-im[v]*ci,xi=re[v]*ci+im[v]*cr;re[v]=re[u]-xr;im[v]=im[u]-xi;re[u]+=xr;im[u]+=xi;const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t}}}}

const KM=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88],Kn=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
function corr(a,b){const m=x=>x.reduce((s,v)=>s+v,0)/x.length,ma=m(a),mb=m(b);let n=0,da=0,db=0;for(let i=0;i<a.length;i++){n+=(a[i]-ma)*(b[i]-mb);da+=(a[i]-ma)**2;db+=(b[i]-mb)**2}return n/Math.sqrt(da*db||1)}
const tpl=[];for(let r=0;r<12;r++){for(const [q,t] of [['',4],['m',3]]){const v=new Array(12).fill(0);v[r]=1;v[(r+t)%12]=.9;v[(r+7)%12]=.8;tpl.push({r,q,v})}}

async function analyze(){
 const sr=buf.sampleRate,N=8192,hop=Math.floor(sr*.25),len=buf.length,c0=buf.getChannelData(0),c1=buf.numberOfChannels>1?buf.getChannelData(1):c0;
 const win=new Float32Array(N).map((_,i)=>.5-.5*Math.cos(2*Math.PI*i/N)),frames=[],tot=new Array(12).fill(0);
 const lo=Math.ceil(70*N/sr),hi=Math.floor(2000*N/sr),pcs=[];
 for(let k=lo;k<=hi;k++)pcs[k]=((Math.round(12*Math.log2(k*sr/N/440))+9)%12+12)%12;
 let nf=0;
 for(let p=0;p+N<=len;p+=hop,nf++){
  const re=new Float32Array(N),im=new Float32Array(N);
  for(let i=0;i<N;i++)re[i]=(c0[p+i]+c1[p+i])*.5*win[i];
  fft(re,im);const c=new Array(12).fill(0);
  for(let k=lo;k<=hi;k++)c[pcs[k]]+=Math.log(1+Math.hypot(re[k],im[k])*10);
  frames.push(c);c.forEach((v,i)=>tot[i]+=v);
  if(nf%40==0){$('#st').textContent='Menganalisis… '+Math.round(p/len*100)+'%';await wait()}
 }
 keys=[];for(let t=0;t<12;t++){const rot=a=>a.map((_,i)=>a[(i-t+12)%12]);keys.push({t,m:0,s:corr(tot,rot(KM))});keys.push({t,m:1,s:corr(tot,rot(Kn))})}
 keys.sort((a,b)=>b.s-a.s);
 chords=[];
 for(let i=0;i+1<frames.length;i+=2){
  const c=frames[i].map((v,j)=>v+frames[i+1][j]),e=c.reduce((s,v)=>s+v,0);
  let best=null,bs=-1;for(const t of tpl){let d=0,a=0,b=0;for(let j=0;j<12;j++){d+=c[j]*t.v[j];a+=c[j]**2;b+=t.v[j]**2}const s=d/Math.sqrt(a*b||1);if(s>bs){bs=s;best=t}}
  const nm=e<1?'-':best,last=chords[chords.length-1];
  if(last&&last.c===nm)last.end=(i+2)*hop/sr;else chords.push({c:nm,start:i*hop/sr,end:(i+2)*hop/sr})
 }
}
const doOf=k=>k.m?(k.t+3)%12:k.t;
function showKey(i){const k=keys[i];$('#doKey').textContent='Do = '+NOTES[(doOf(k)+sem+12)%12];
 $('#keyInfo').textContent='Kunci: '+NOTES[(k.t+sem+12)%12]+(k.m?' minor':' mayor')+(sem?` (sudah digeser ${sem>0?'+':''}${sem})`:'');
 $('#alt').innerHTML='Salah? Coba: '+keys.slice(0,4).map((x,j)=>`<button class="s" data-i="${j}">${NOTES[x.t]}${x.m?'m':''}</button>`).join('');
 curKey=i}
let curKey=0;
$('#alt').onclick=e=>{if(e.target.dataset.i)showKey(+e.target.dataset.i)};
function cname(c){return c==='-'||!c?'-':NOTES[(c.r+sem+12)%12]+c.q}
function drawChords(){}
let hl=-1;

$('#file').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;$('#fn').textContent=' '+f.name;$('#st').textContent='Membaca file…';
 try{const ac=new (window.AudioContext||window.webkitAudioContext)();buf=await ac.decodeAudioData(await f.arrayBuffer());ac.close()}
 catch(err){$('#st').textContent='Format tidak didukung browser ini. Coba MP3/WAV/M4A/OGG.';return}
 if(fileUrl)URL.revokeObjectURL(fileUrl);fileUrl=URL.createObjectURL(f);au.src=fileUrl;outCh=null;
 sem=0;tempo=1;$('#sem').value=0;$('#tempo').value=100;$('#semv').textContent=0;$('#tv').textContent=100;
 await analyze();await detectBeat();$('#st').textContent='Selesai ('+Math.round(buf.duration)+' dtk)';
 ['#res','#ctl','#chc'].forEach(s=>$(s).hidden=false);showKey(0);drawChords()};

$('#sem').oninput=e=>$('#semv').textContent=e.target.value;
$('#tempo').oninput=e=>$('#tv').textContent=e.target.value;

async function wsola(chs,ratio){
 const N=2048,H=1024,D=256,len=chs[0].length;if(len<N*2)return chs;
 const L=Math.floor(len*ratio),nf=Math.ceil(L/H),win=new Float32Array(N).map((_,i)=>.5-.5*Math.cos(2*Math.PI*i/N));
 const mono=chs.length>1?chs[0].map((v,i)=>(v+chs[1][i])*.5):chs[0],out=chs.map(()=>new Float32Array(L+N*2));let prev=0;
 for(let k=0;k<nf;k++){
  const nom=Math.round(k*H/ratio);let p=Math.min(Math.max(nom,0),len-N);
  if(k>0){const ref=prev+H;if(ref<=len-N){let best=-1e30;for(let d=-D;d<=D;d+=8){const c=nom+d;if(c<0||c>len-N)continue;let s=0;for(let i=0;i<N;i+=8)s+=mono[c+i]*mono[ref+i];if(s>best){best=s;p=c}}}}
  const o=k*H;chs.forEach((ch,j)=>{const O=out[j];for(let i=0;i<N;i++)O[o+i]+=ch[p+i]*win[i]});prev=p;
  if(k%80==0){$('#pg').textContent='Memproses… '+Math.round(k/nf*100)+'%';await wait()}
 }
 return out.map(o=>o.subarray(0,L))}

function wavBlob(chs,sr){const n=chs[0].length,c=chs.length,b=new ArrayBuffer(44+n*c*2),v=new DataView(b),w=(o,s)=>[...s].forEach((ch,i)=>v.setUint8(o+i,ch.charCodeAt(0)));
 w(0,'RIFF');v.setUint32(4,36+n*c*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,c,true);v.setUint32(24,sr,true);v.setUint32(28,sr*c*2,true);v.setUint16(32,c*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*c*2,true);
 let o=44;for(let i=0;i<n;i++)for(let j=0;j<c;j++){const s=Math.max(-1,Math.min(1,chs[j][i]));v.setInt16(o,s<0?s*32768:s*32767,true);o+=2}
 return new Blob([b],{type:'audio/wav'})}

$('#go').onclick=async()=>{
 sem=+$('#sem').value;tempo=+$('#tempo').value/100;const r=2**(sem/12);
 if(sem===0&&tempo===1){au.src=fileUrl;outCh=null;showKey(curKey);drawChords();return}
 $('#go').disabled=true;au.pause();
 let chs=[...Array(Math.min(2,buf.numberOfChannels))].map((_,i)=>buf.getChannelData(i));
 if(r!==1){const m=Math.floor(chs[0].length/r);chs=chs.map(c=>{const o=new Float32Array(m);for(let i=0;i<m;i++){const x=i*r,a=Math.floor(x),f=x-a;o[i]=c[a]*(1-f)+(c[a+1]||0)*f}return o})}
 const ratio=r/tempo;if(Math.abs(ratio-1)>.001)chs=await wsola(chs,ratio);
 outCh=chs;outSr=buf.sampleRate;au.src=URL.createObjectURL(wavBlob(chs,outSr));
 $('#pg').textContent='Siap. Tekan play.';$('#go').disabled=false;showKey(curKey);drawChords();hl=-1};
$('#rst').onclick=()=>{$('#sem').value=0;$('#tempo').value=100;$('#semv').textContent=0;$('#tv').textContent=100;$('#go').click()};

function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
const cur=()=>outCh||[...Array(Math.min(2,buf.numberOfChannels))].map((_,i)=>buf.getChannelData(i));
$('#exw').onclick=()=>buf&&dl(wavBlob(cur(),buf.sampleRate),'hasil.wav');
$('#exm').onclick=async()=>{if(!buf)return;$('#pg').textContent='Menyiapkan MP3…';
 try{if(!window.lamejs)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
 catch(e){$('#pg').textContent='MP3 butuh internet sekali untuk memuat encoder. Pakai WAV jika offline.';return}
 const chs=cur(),sr=buf.sampleRate,enc=new lamejs.Mp3Encoder(chs.length,sr,128),I=a=>{const o=new Int16Array(a.length);for(let i=0;i<a.length;i++){const s=Math.max(-1,Math.min(1,a[i]));o[i]=s<0?s*32768:s*32767}return o},parts=[];
 for(let i=0;i<chs[0].length;i+=1152){const l=I(chs[0].subarray(i,i+1152)),d=chs.length>1?enc.encodeBuffer(l,I(chs[1].subarray(i,i+1152))):enc.encodeBuffer(l);if(d.length)parts.push(d);if(i%(1152*300)==0){$('#pg').textContent='Encode MP3… '+Math.round(i/chs[0].length*100)+'%';await wait()}}
 parts.push(enc.flush());$('#pg').textContent='';dl(new Blob(parts,{type:'audio/mpeg'}),'hasil.mp3')};

// Ketukan
let beat={p:.5,o:0,sh:0};
async function detectBeat(){
 $('#st').textContent='Mendeteksi ketukan…';await wait();
 const sr=buf.sampleRate,h=Math.floor(sr*.005),c0=buf.getChannelData(0),n=Math.floor(buf.length/h),env=new Float32Array(n),on=new Float32Array(n);
 for(let i=0;i<n;i++){let q=0;for(let j=0;j<h;j+=2){const v=c0[i*h+j];q+=v*v}env[i]=Math.sqrt(q)}
 for(let i=1;i<n;i++)on[i]=Math.max(0,env[i]-env[i-1]);
 let bl=100,bv=-1;
 for(let l=66;l<=200;l++){let q=0;for(let i=0;i+l<n;i++)q+=on[i]*on[i+l];const bpm=12000/l;q*=1-.3*Math.abs(Math.log2(bpm/110));if(q>bv){bv=q;bl=l}}
 await wait();let bp=bl,bo=0,bs=-1;
 for(let p=bl-1.5;p<=bl+1.5;p+=.03)for(let f=0;f<50;f++){const ph=p*f/50;let q=0;for(let t=ph;t<n-2;t+=p){const i=Math.round(t);q+=Math.max(on[i-1]||0,on[i],on[i+1])}if(q>bs){bs=q;bp=p;bo=ph}}
 beat={p:bp*.005,o:bo*.005,sh:0}}
$('#b1').onclick=()=>beat.sh=(beat.sh+1)%4;
$('#bh').onclick=()=>beat.p*=2;$('#bd').onclick=()=>beat.p/=2;

const cv=$('#tl'),cx=cv.getContext('2d'),PPS=70;let nowT='',bpmT='';
function draw(){
 requestAnimationFrame(draw);
 if(!buf||$('#chc').hidden||$('#pageSong').hidden)return;
 const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
 if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
 cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
 const t=au.currentTime*(outCh?tempo:1),px=W*.3,X=q=>px+(q-t)*PPS;
 let ci=-1;
 chords.forEach((c,i)=>{const x0=X(c.start),x1=X(c.end),on=t>=c.start&&t<c.end;if(on)ci=i;if(x1<0||x0>W)return;
  cx.fillStyle=on?'#22c55e':'#1f2937';cx.beginPath();cx.roundRect(x0+1,22,Math.max(2,x1-x0-2),H-30,6);cx.fill();
  cx.save();cx.beginPath();cx.rect(x0+1,22,x1-x0-2,H-30);cx.clip();cx.fillStyle=on?'#06220f':'#f3f4f6';cx.font='bold 14px system-ui';cx.textBaseline='middle';cx.fillText(cname(c.c),Math.max(x0+5,Math.min(5,x1-30)),22+(H-30)/2);cx.restore()});
 const p=beat.p,t0=t-px/PPS-1,t1=t+(W-px)/PPS+1;cx.textAlign='center';
 for(let k=Math.floor((t0-beat.o)/p);beat.o+k*p<t1;k++){const tt=beat.o+k*p;if(tt<0)continue;const x=X(tt),b=(((k+beat.sh)%4)+4)%4;
  cx.strokeStyle=b?'rgba(156,163,175,.45)':'rgba(243,244,246,.85)';cx.lineWidth=b?1:2.5;cx.setLineDash([]);cx.beginPath();cx.moveTo(x,16);cx.lineTo(x,H);cx.stroke();
  cx.fillStyle=b?'#9ca3af':'#fff';cx.font=(b?'10':'bold 12')+'px system-ui';cx.fillText(b+1,x,10);
  const hx=X(tt+p/2);cx.strokeStyle='rgba(156,163,175,.25)';cx.lineWidth=1;cx.setLineDash([3,4]);cx.beginPath();cx.moveTo(hx,20);cx.lineTo(hx,H);cx.stroke()}
 cx.setLineDash([]);cx.textAlign='left';cx.strokeStyle='#f97316';cx.lineWidth=2;cx.beginPath();cx.moveTo(px,0);cx.lineTo(px,H);cx.stroke();
 let nt='-';if(ci>=0){const nx=chords.slice(ci+1).find(c=>cname(c.c)!==cname(chords[ci].c));nt=cname(chords[ci].c)+(nx?'  →  '+cname(nx.c):'')}
 if(nt!==nowT){nowT=nt;$('#now').textContent=nt}
 const bt='≈ '+Math.round(60/beat.p*(outCh?tempo:1))+' BPM · 4/4';if(bt!==bpmT){bpmT=bt;$('#bpm').textContent=bt}}
draw();

// Halaman
function page(n){$('#pageSong').hidden=n!==1;$('#pageTune').hidden=n!==2;$('#n1').className=n==1?'on':'';$('#n2').className=n==2?'on':'';if(n==1&&tOn)$('#tb').click();window.scrollTo(0,0)}
$('#n1').onclick=()=>page(1);$('#n2').onclick=()=>page(2);

// Tuner
const NS=[['E2',82.41],['A2',110],['D3',146.83],['G3',196],['B3',246.94],['E4',329.63]];
$('#strs').innerHTML=NS.map((x,i)=>`<div class="str" id="s${i}">${x[0]}<small>senar ${6-i}</small></div>`).join('');
$('#ticks').innerHTML=[-50,-40,-30,-20,-10,0,10,20,30,40,50].map(c=>{const a=c*1.2*Math.PI/180,r1=105,r2=c%50==0&&c?124:c==0?126:116;return `<line x1="${150+r1*Math.sin(a)}" y1="${150-r1*Math.cos(a)}" x2="${150+r2*Math.sin(a)}" y2="${150-r2*Math.cos(a)}" stroke="${c==0?'#22c55e':'#6b7280'}" stroke-width="${c==0?4:2}"/>`}).join('');
let tOn=false,tStream,tAc,sc=0;
function setNeedle(c){$('#needle').style.transform=`rotate(${c*1.2}deg)`}
$('#tb').onclick=async()=>{
 if(tOn){tOn=false;tStream.getTracks().forEach(t=>t.stop());tAc.close();$('#tb').textContent='🎤 Mulai';setNeedle(0);return}
 try{tStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}catch(e){$('#tc').textContent='Izin mikrofon ditolak';return}
 tAc=new AudioContext();const an=tAc.createAnalyser();an.fftSize=4096;tAc.createMediaStreamSource(tStream).connect(an);tOn=true;$('#tb').textContent='⏹ Berhenti';
 const d=new Float32Array(4096),sr=tAc.sampleRate;let quiet=0;
 (function loop(){if(!tOn)return;an.getFloatTimeDomainData(d);let rms=0;for(const x of d)rms+=x*x;rms=Math.sqrt(rms/d.length);let found=false;
  if(rms>.01){const mn=Math.floor(sr/400),mx=Math.floor(sr/70),cs=[];let mxv=0;for(let l=mn;l<=mx;l++){let q=0,e=0;for(let i=0;i<2048;i++){q+=d[i]*d[i+l];e+=d[i+l]*d[i+l]}cs[l]=q/Math.sqrt(e+1e-9);if(cs[l]>mxv)mxv=cs[l]}
   let bl=0;for(let l=mn;l<=mx;l++)if(cs[l]>mxv*.9&&cs[l]>=(cs[l-1]||0)&&cs[l]>=(cs[l+1]||0)){bl=l;break}
   if(bl){const f=sr/bl;let bi=0,bd=1e9;NS.forEach((x,i)=>{const dd=Math.abs(1200*Math.log2(f/x[1]));if(dd<bd){bd=dd;bi=i}});
    const c=Math.max(-50,Math.min(50,1200*Math.log2(f/NS[bi][1])));sc+=(c-sc)*.4;setNeedle(sc);found=true;quiet=0;
    const ok=Math.abs(c)<5;$('#tn').textContent=NS[bi][0];$('#tn').style.color=ok?'#22c55e':'#f3f4f6';$('#hz').textContent=f.toFixed(1)+' Hz · '+(c>0?'+':'')+Math.round(c)+' cent';
    $('#tc').textContent=ok?'✅ Pas!':c<0?'Terlalu rendah, kencangkan senar ↑':'Terlalu tinggi, kendurkan senar ↓';
    NS.forEach((x,i)=>{$('#s'+i).className='str'+(i==bi?(ok?' on ok':' on'):'')})}}
  if(!found&&++quiet>40){setNeedle(0);sc=0}
  requestAnimationFrame(loop)})()};
